[programs.okular]
template = "pkg"
description = "KDE document viewer"

[programs.slack]
description = "Slack desktop app"

[programs.slack.version]
command = "slack --version 2>/dev/null || rpm -q slack"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.slack.install]
dnf = "file:scripts/install-slack-fedora.sh"

[programs.teams-for-linux]
description = "Microsoft Teams client"

[programs.teams-for-linux.version]
command = "teams-for-linux --version 2>/dev/null || rpm -q teams-for-linux"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.teams-for-linux.install]
dnf = "file:scripts/install-teams-fedora.sh"

[programs.obsidian]
description = "Obsidian notes"
depends-on = ["flathub-remote"]

[programs.obsidian.version]
command = "flatpak --user info md.obsidian.Obsidian"
regex = "Version: ([0-9][0-9.]*)"

[programs.obsidian.install]
flatpak = "flatpak --user install -y flathub md.obsidian.Obsidian"
