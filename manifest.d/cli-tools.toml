# Installed from taps, so the full tap path is required.
[programs.tpack]
description = "tmux package manager"

[programs.tpack.version]
command = "tpack --version 2>/dev/null || brew list --versions tpack"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.tpack.install]
brew = "brew install tmuxpack/tpack/tpack"

[programs.opencode]
description = "opencode agent"

[programs.opencode.version]
command = "opencode --version 2>/dev/null || brew list --versions opencode"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.opencode.install]
brew = "brew install anomalyco/tap/opencode"

[programs.jetbrains-toolbox]
description = "JetBrains Toolbox"

[programs.jetbrains-toolbox.version]
command = "brew list --cask --versions jetbrains-toolbox-linux"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.jetbrains-toolbox.install]
brew = "brew tap ublue-os/tap && brew trust ublue-os/tap && brew install --cask jetbrains-toolbox-linux"

[programs.ngrok]
description = "ngrok tunnel"

[programs.ngrok.version]
command = "ngrok version 2>/dev/null || $HOME/.local/bin/ngrok version"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.ngrok.install]
script = "file:scripts/install-ngrok.sh"

# jumpkwapp has no --version flag; the check reports the pinned release.
[programs.jumpkwapp]
description = "jumpkwapp window jumper"

[programs.jumpkwapp.version]
command = "test -x $HOME/.local/bin/jumpkwapp && echo 0.01"
regex = "([0-9][0-9.]*)"

[programs.jumpkwapp.install]
script = "file:scripts/install-jumpkwapp.sh"
