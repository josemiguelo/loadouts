[programs.1password]
description = "1Password desktop app"

[programs.1password.install.dnf-repo]
[programs.1password.install.dnf-repo.with]
repofile = "scripts/install/repos/1password.repo"

# Omarchy ships 1Password in its own [omarchy] repo; the omarchy-1password
# script finishes the setup with Omarchy's installer.
[programs.1password.install.omarchy-pkg]

[programs.1password-cli]
description = "1Password CLI (op)"
via = ["omarchy-pkg"]
