# Omarchy only: 1Password through Omarchy's installer, which adds the
# Chromium extension entry and opens the app when done; started at login
# unscaled like Omarchy's launcher does (Quick Access fits), and
# Ctrl+Shift+Space opens Quick Access.
[scripts.omarchy-1password]
description = "1Password via Omarchy's installer, unscaled, Ctrl+Shift+Space Quick Access"
file = "scripts/maintain/omarchy-1password.sh"
check = "file:scripts/maintain/omarchy-1password.sh check"
after = ["programs.1password", "programs.1password-cli"]
