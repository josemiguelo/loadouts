# The Pomodoro timer plugin (from omarchy-plugins, or its omarchy-bar-icons
# clone once that has its place; hence after both): next to
# the bar's clock, its settings from scripts/maintain/omarchy-pomodoro/, and a
# Pomodoro submenu under Trigger in the Omarchy menu.
[scripts.omarchy-pomodoro]
description = "Pomodoro timer: by the clock, 50+10, Trigger menu entries"
file = "scripts/maintain/omarchy-pomodoro.sh"
check = "file:scripts/maintain/omarchy-pomodoro.sh check"
after = ["scripts.omarchy-plugins", "scripts.omarchy-bar-icons"]
