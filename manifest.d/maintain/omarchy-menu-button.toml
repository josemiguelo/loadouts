# The Omarchy logo as a real icon filling the bar, in the place of Keystroke's
# own bar button (scripts/maintain/omarchy-menu-button/plugin); Keystroke comes
# from omarchy-plugins, hence after it. Placed by omarchy-bar-widgets.
[scripts.omarchy-menu-button]
description = "Bar widget: the Omarchy logo as an icon, opening the menu"
file = "scripts/maintain/omarchy-menu-button.sh"
check = "file:scripts/maintain/omarchy-menu-button.sh check"
after = ["scripts.omarchy-plugins"]
