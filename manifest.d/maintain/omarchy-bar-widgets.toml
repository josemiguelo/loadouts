# Where bar widgets from omarchy-plugins, omarchy-workspace-layout and
# omarchy-menu-button sit, one per line of the opt-in:
# "<id> <section> <before|after> <neighbour-id>", with each widget's settings
# from scripts/maintain/omarchy-bar/settings/<id>.json when it has one.
[scripts.omarchy-bar-widgets]
description = "Bar widgets' places and settings"
file = "scripts/maintain/omarchy-bar-widgets.sh"
check = "file:scripts/maintain/omarchy-bar-widgets.sh check $@"
after = ["scripts.omarchy-plugins", "scripts.omarchy-workspace-layout", "scripts.omarchy-menu-button"]
