# t2fanrd reads /etc/t2fand.conf, which no package owns — this script is the
# only record of the intended fan curve. Content must match exactly.
[scripts.t2-fan-curve]
description = "t2fanrd fan curve in /etc/t2fand.conf"
file = "scripts/maintain/t2-fan-curve.sh"
check = "file:scripts/maintain/t2-fan-curve.sh check"
after = ["programs.t2fanrd"]
# tee into /etc and the service restart run through sudo.
sudo = true
