[programs.firefox]
description = "Firefox browser"

[programs.firefox.version]
command = "firefox --version 2>/dev/null || rpm -q firefox"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.firefox.install]
dnf = "file:scripts/install-firefox-fedora.sh"

# The rpm firefox wins; the flatpak gets removed.
[scripts.remove-firefox-flatpak]
description = "remove the firefox flatpak"
run = "flatpak --user uninstall --delete-data -y org.mozilla.firefox"
check = "! flatpak --user info org.mozilla.firefox >/dev/null 2>&1"
