# Flathub as a user-level remote (this machine is not bootc, matching the
# source's --user branch). A program so other flatpaks can depend on it.
[programs.flathub-remote]
description = "flathub flatpak remote (user)"

# A remote, not an app: probe comes from the flatpak installer, the rest
# is its own.
[programs.flathub-remote.install.flatpak]
command = "flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"
check = "flatpak --user remotes --columns=name | grep -x flathub"
regex = "(flathub)"
