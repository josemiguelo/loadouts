# Standard native package, manager-neutral: programs opt in with
# template = "pkg", and each machine's machines/<name>.toml picks which
# install key it uses (dnf/apt/pacman/brew).
[templates.pkg.version]
# Version oracle chain: ask the tool itself, then each package database in
# turn. Absent managers exit non-zero and fall through; only if every oracle
# fails is the program missing. No trailing pipes here: a pipeline's exit code
# is the last command's, which would make missing programs look installed.
command = "{name} --version 2>/dev/null || rpm -q {name} 2>/dev/null || dpkg-query -W {name} 2>/dev/null || brew list --versions {name} 2>/dev/null"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[templates.pkg.install]
dnf = "sudo dnf install -y {name}"
apt = "sudo apt-get install -y {name}"
pacman = "sudo pacman -S --noconfirm {name}"
brew = "brew install {name}"
