[programs.asdf]
description = "asdf version manager"

[programs.asdf.version]
command = "asdf --version 2>/dev/null || $HOME/.local/bin/asdf --version"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.asdf.install.script]
command = "file:scripts/install-asdf.sh"

[scripts.asdf-tools]
description = "asdf plugins and tool builds from ~/.tool-versions"
file = "scripts/asdf-tools.sh"
check = "file:scripts/asdf-tools.sh check"
after = ["programs.asdf", "scripts.chezmoi-init"]

# asdf only seeds default packages into NEWLY built versions; this backfills
# ~/.default-npm-packages and ~/.default-gems into every existing version.
[scripts.asdf-default-packages]
description = "default npm/gem packages in every tool version"
file = "scripts/asdf-default-packages.sh"
check = "file:scripts/asdf-default-packages.sh check"
after = ["scripts.asdf-tools"]
