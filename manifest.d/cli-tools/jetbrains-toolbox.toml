[programs.jetbrains-toolbox]
description = "JetBrains Toolbox"

[programs.jetbrains-toolbox.version]
command = "brew list --cask --versions jetbrains-toolbox-linux"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.jetbrains-toolbox.install]
brew = "brew tap ublue-os/tap && brew trust ublue-os/tap && brew install --cask jetbrains-toolbox-linux"

[scripts.link-jetbrains-launchers]
description = "symlink JetBrains Toolbox launcher scripts into ~/.local/bin"
file = "scripts/link-jetbrains-launchers.sh"
check = "sh scripts/link-jetbrains-launchers.sh check"
after = ["programs.jetbrains-toolbox"]
