[programs.jumpkwapp]
description = "jumpkwapp window jumper"

[programs.jumpkwapp.version]
command = "test -x $HOME/.local/bin/jumpkwapp && echo 0.01" # it has no --version flag; the check reports the pinned release.
regex = "([0-9][0-9.]*)"

[programs.jumpkwapp.install.script]
command = "file:scripts/install-jumpkwapp.sh"
