# Installed from taps, so the full tap path is required.
[programs.tpack]
description = "tmux package manager"

[programs.tpack.version]
command = "tpack --version 2>/dev/null || brew list --versions tpack"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.tpack.install]
brew = "brew install tmuxpack/tpack/tpack"
