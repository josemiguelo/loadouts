[programs.solaar]
template = "pkg"
description = "Logitech device manager"

[scripts.solaar-no-autostart]
description = "remove solaar autostart entry"
run = "sudo rm -f /etc/xdg/autostart/solaar.desktop"
check = "test ! -f /etc/xdg/autostart/solaar.desktop"
after = ["programs.solaar"]

[programs.kitty]
template = "pkg"
description = "kitty terminal emulator"
depends-on = ["dnf-plugins-core"]

[programs.kitty.install]
dnf = "file:scripts/install-kitty-fedora.sh"
