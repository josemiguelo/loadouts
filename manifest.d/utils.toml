[programs.solaar]
template = "pkg"
description = "Logitech device manager"

[scripts.solaar-no-autostart]
description = "remove solaar autostart entry"
run = "sudo rm -f /etc/xdg/autostart/solaar.desktop"
check = "test ! -f /etc/xdg/autostart/solaar.desktop"
after = ["programs.solaar"]

[programs.kitty]
description = "kitty terminal emulator"
depends-on = ["dnf-plugins-core"]

[programs.kitty.version]
command = "kitty --version 2>/dev/null || rpm -q kitty"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.kitty.install]
dnf = "file:scripts/install-kitty-fedora.sh"

[programs.firefox]
description = "Firefox browser"

[programs.firefox.version]
command = "firefox --version 2>/dev/null || rpm -q firefox"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.firefox.install]
dnf = "file:scripts/install-firefox-fedora.sh"

[programs.1password]
description = "1Password desktop app"

[programs.1password.version]
command = "1password --version 2>/dev/null || rpm -q 1password"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.1password.install]
dnf = "file:scripts/install-1password-fedora.sh"

[programs.google-chrome-stable]
description = "Google Chrome browser"

[programs.google-chrome-stable.version]
command = "google-chrome-stable --version 2>/dev/null || rpm -q google-chrome-stable"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.google-chrome-stable.install]
dnf = "file:scripts/install-chrome-fedora.sh"

[programs.anydesk]
description = "AnyDesk remote desktop"

[programs.anydesk.version]
command = "anydesk --version 2>/dev/null || rpm -q anydesk"
regex = "([0-9]+\\.[0-9][0-9.]*)"

[programs.anydesk.install]
dnf = "file:scripts/install-anydesk-fedora.sh"

# Flathub as a user-level remote (this machine is not bootc, matching the
# source's --user branch). A program so other flatpaks can depend on it.
[programs.flathub-remote]
description = "flathub flatpak remote (user)"

[programs.flathub-remote.version]
command = "flatpak --user remotes --columns=name | grep -x flathub"
regex = "(flathub)"

[programs.flathub-remote.install]
flatpak = "flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"

# The rpm firefox wins; the flatpak gets removed.
[scripts.remove-firefox-flatpak]
description = "remove the firefox flatpak"
run = "flatpak --user uninstall --delete-data -y org.mozilla.firefox"
check = "! flatpak --user info org.mozilla.firefox >/dev/null 2>&1"

[scripts.chezmoi-init]
description = "clone and apply the chezmoi dotfiles"
file = "scripts/chezmoi-init.sh"
check = "test -d $HOME/.local/share/chezmoi"
after = ["programs.chezmoi"]

[scripts.setup-ssh]
description = "machine ssh key and agent auto-add config"
file = "scripts/setup-ssh.sh"
check = "test -f $HOME/.ssh/$1 && grep -q 'AddKeysToAgent yes' $HOME/.ssh/config"
