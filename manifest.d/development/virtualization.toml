[programs.virtualization]
description = "virtualization stack (libvirt, qemu, virt-manager)"

# A dnf group, not a package: the two-mode script is the check oracle.
[programs.virtualization.install.dnf]
command = "file:scripts/virtualization.sh install"
check = "sh scripts/virtualization.sh check"

# The source script ran usermod as root ($(whoami) bug) — the intent was the
# login user, which is what this does.
[scripts.setup-libvirt]
description = "enable libvirtd and join the kvm group"
run = "sudo systemctl enable libvirtd && sudo systemctl start libvirtd && sudo usermod -a -G kvm \"$USER\""
check = "systemctl is-enabled libvirtd >/dev/null 2>&1 && id -nG \"$USER\" | grep -qw kvm"
after = ["programs.virtualization"]
