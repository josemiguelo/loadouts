# Fedora toolchain batch: the Development Tools group and the build
# libraries used by asdf/pyenv/ruby builds — related, installed together.

[programs.development-tools-group]
description = "dnf Development Tools group"

# A dnf group, not a package: its own install command and check.
[programs.development-tools-group.install.dnf]
command = "sudo dnf group install -y development-tools"
check = "dnf group list --installed 2>/dev/null | grep '^development-tools '"
regex = "(development-tools)"

[programs.gcc]
template = "pkg"

[programs.autoconf]
template = "pkg"

[programs.patch]
template = "pkg"

[programs.rust]
template = "pkg"

[programs.findutils]
template = "pkg"

[programs.zlib-devel]
template = "pkg"

# Virtual provide on modern Fedora: override the dnf installer's check.
[programs.zlib-devel.install.dnf]
check = "rpm -q --whatprovides zlib-devel"

