extends = "omarchy"

scripts = [
  "dotfiles-bootstrap",
  # the key `gh auth login` generated and uploaded (GitHub: "t2-macbook-omarchy")
  "setup-ssh id_ed25519",
  # MacBookPro16,1 (T2) hardware
  "t2-hid-apple-keyboard-arch",
  "t2-fan-curve",
  "t2-boot-clock",
  # Logitech receiver/mouse manager, without its session autostart.
  "solaar-no-autostart",
  # KVM/QEMU with virt-manager
  "setup-libvirt-arch",
  "ufw-libvirt",
]

[pm]
t2fanrd = "omarchy-pkg"
solaar = "omarchy-pkg"
libvirt = "omarchy-pkg"
qemu-desktop = "omarchy-pkg"
virt-manager = "omarchy-pkg"
virt-install = "omarchy-pkg"
virt-viewer = "omarchy-pkg"
dnsmasq = "omarchy-pkg"
edk2-ovmf = "omarchy-pkg"
swtpm = "omarchy-pkg"
