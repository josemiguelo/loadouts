extends = "fedora"

scripts = [
  "omarchy-default-terminal",
  "omarchy-default-browser",
  "omarchy-xwaylandvideobridge",
  "omarchy-tmux-theme",
  "selinux-sleep-hook",
  "solaar-no-autostart",
  "setup-ssh fedora",
  "setup-libvirt",
  "hid-apple-keyboard",
  "fan-curve",
  "boot-clock",
]

[pm]
# omedora base package; mapped so workmux (brew) can depend on it.
tmux = "dnf"
solaar = "dnf"
virtualization = "dnf"
