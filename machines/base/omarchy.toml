# Shared truth for every Omarchy machine. System packages install through
# Omarchy's own commands; brew only carries tools with no trustworthy Arch
# package (tpack, workmux — their authors' own taps). Host-specifics
# (hardware, ssh key names) live in the machine files.
base = true

scripts = [
  "default-shell",
  "dotfiles-pull",
  "dotfiles-apply",
  "dotfiles-push",
  "dotfiles-ssh-remote",
  "zsh-plugins",
  "setup-git",
  "mise-tools",
  "mise-default-packages",
  "setup-completions",
  "tmux-plugins",
  "omarchy-tmux-theme",
  "nvim-plugins",
  "omarchy-default-terminal",
  "omarchy-default-agent claude",
  "omarchy-dictation",
  "omarchy-dictation-gpu",
  "omarchy-1password",
  "omarchy-default-browser-arch brave",
  "omarchy-vscode",
  "link-jetbrains-launchers-linux",
  "omarchy-brave",
  "omarchy-natural-scroll",
  # web apps and agent launchers not wanted; Google in HEY's place
  "omarchy-webapps-remove Basecamp HEY",
  "omarchy-agent-launchers-prune claude codex gh gemini",
  "omarchy-webapp-gmail",
  "omarchy-webapp-google-calendar",
  "omarchy-google-bindings",
]

[pm]
zsh = "omarchy-pkg"
chezmoi = "omarchy-pkg"
git-delta = "omarchy-pkg"
atuin = "omarchy-pkg"
yazi = "omarchy-pkg"
ttf-firacode-nerd = "omarchy-pkg"
tmux = "omarchy-pkg"
curl = "omarchy-pkg"
git = "omarchy-pkg"
gcc = "omarchy-pkg"
procps-ng = "omarchy-pkg"
setup-brew = "script"
brew-taps = "script"
tpack = "brew-cask"
workmux = "brew"
awscli = "brew"
just = "brew"
trash-cli = "brew"
vim-enhanced = "brew"
yq = "brew"
google-cloud-cli = "brew-cask"
ngrok = "script"
mise = "omarchy-pkg"
kitty = "omarchy-pkg"
voxtype = "omarchy-pkg"
wtype = "omarchy-pkg"
1password = "omarchy-pkg"
1password-cli = "omarchy-pkg"
code = "omarchy-pkg"
sublime-text = "omarchy-pkg"
obsidian = "omarchy-pkg"
vlc = "omarchy-pkg"
scrcpy = "brew"
jetbrains-toolbox = "script"
# AUR, each one approved: official builds, repackaged.
brave = "omarchy-aur"
slack = "omarchy-aur"
teams-for-linux = "omarchy-aur"
anydesk = "omarchy-aur"
antigravity = "omarchy-aur"
bat = "omarchy-pkg"
fd = "omarchy-pkg"
fzf = "omarchy-pkg"
lazydocker = "omarchy-pkg"
ripgrep = "omarchy-pkg"
zoxide = "omarchy-pkg"
tree-sitter-cli = "omarchy-pkg"
btop = "omarchy-pkg"
lazygit = "omarchy-pkg"
starship = "omarchy-pkg"
