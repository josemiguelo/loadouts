# Shared truth for every Omarchy machine. System packages install through
# Omarchy's own commands; brew only carries tools with no trustworthy Arch
# package (tpack, workmux — their authors' own taps). Host-specifics
# (hardware, ssh key names) live in the machine files.
base = true

scripts = [
  "default-shell",
  "dotfiles-pull",
  "dotfiles-apply",
  "dotfiles-push",
  "dotfiles-ssh-remote",
  "zsh-plugins",
  "setup-git",
  "mise-tools",
  "mise-default-packages",
  "setup-completions",
  "tmux-plugins",
  "omarchy-tmux-theme",
  "nvim-plugins",
  "omarchy-default-terminal",
  "omarchy-default-agent claude",
  "omarchy-dictation",
  "omarchy-dictation-gpu",
  "omarchy-1password",
  "omarchy-default-browser-arch brave",
  "omarchy-vscode",
  "link-jetbrains-launchers-linux",
  "omarchy-brave",
  # Hyprland settings from scripts/maintain/hypr-config/ (natural scrolling, look and feel)
  "omarchy-hypr-config input looknfeel",
  # the bar at the bottom, a little thicker than Omarchy's 26, with Spaces
  # (from omarchy-plugins: each workspace's app icons) for the workspaces,
  # its settings in scripts/maintain/omarchy-bar/settings/
  "omarchy-bar bottom 30 tornikegomareli.spaces",
  # web apps and agent launchers not wanted; Google in HEY's place
  "omarchy-webapps-remove Basecamp HEY",
  "omarchy-agent-launchers-prune claude codex gh gemini",
  "omarchy-webapp-gmail",
  "omarchy-webapp-google-calendar",
  "omarchy-google-bindings",
  "omarchy-close-window-key",
  "omarchy-harpoon",
  # local replacements of Omarchy commands, first on the session PATH
  "omarchy-command-overrides",
  # until Omarchy stops saving 0 over the keyboard backlight on repeated blanks
  "omarchy-keyboard-backlight-guard",
  # Keychron Launcher (WebHID) can open Keychron keyboards
  "keychron-launcher-access",
  # shell plugins, by git URL: Keystroke replaces the Omarchy menu; the
  # notification center keeps past notifications behind a bell in the bar;
  # Spaces shows each workspace's apps (placed by omarchy-bar); a Pomodoro
  # timer (configured by omarchy-pomodoro); a Voxtype panel (needs
  # voxtype-tui); media controls with album art (placed by
  # omarchy-bar-widgets)
  '''omarchy-plugins
     https://github.com/evindor/keystroke.git
     https://github.com/jankeesvw/omarchy-notification-center.git
     https://github.com/tornikegomareli/omarchy-spaces.git
     https://github.com/binoymanoj/pomodoro-omarchy.git
     https://github.com/Zeus-Deus/voxtype-omarchy-plugin.git
     https://github.com/crmne/omarchy-mpris.git''',
  # the focused workspace's tiling layout as a glyph on the bar, between
  # Keystroke's logo and the workspaces (placed by omarchy-bar-widgets)
  "omarchy-workspace-layout",
  # where installed bar widgets sit, one per line:
  # <id> <section> <before|after> <neighbour>
  '''omarchy-bar-widgets
     josemiguelo.workspace-layout left after evindor.keystroke
     crmne.mpris left after tornikegomareli.spaces''',
  # Keystroke's Windows extension, from a checkout until it ships upstream
  "omarchy-keystroke-windows",
  # the Pomodoro timer by the clock, 50+10, and its Trigger menu entries
  "omarchy-pomodoro",
]

