# Shared truth for every Fedora workstation. Host-specifics (hardware,
# virtualization choices, ssh key names) live in the machine files.
base = true

scripts = [
  "remove-firefox-flatpak",
  "dotfiles-bootstrap",
  "dotfiles-pull",
  "dotfiles-push",
  "dotfiles-apply",
  "default-shell",
  "asdf-plugins",
  "asdf-tools",
  "asdf-default-packages",
  "nvim-plugins",
  "tmux-plugins",
  "zsh-plugins",
  "dotfiles-ssh-remote",
  "setup-git",
  "download-fonts",
  "setup-completions",
  "link-jetbrains-launchers-linux",
]

[pm]
setup-dnf = "dnf"
setup-brew = "script"
brew-taps = "script"
